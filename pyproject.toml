[project]
name = "docchat-multiagents"
version = "0.1.0"
description = "Document question answering with Docling, LangGraph, and Groq"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling==2.144.0",
    "gradio==6.31.0",
    "langchain-chroma==1.1.0",
    "langchain-classic==1.0.8",
    "langchain-community==0.4.2",
    "langchain-core==1.7.1",
    "langchain-groq==1.1.3",
    "langchain-huggingface==1.2.3",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.18",
    "loguru==0.7.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "rank-bm25==0.2.2",
    "sentence-transformers==6.2.0",
    "transformers==5.21.0",
]

[project.optional-dependencies]
cpu = ["torch==2.14.1", "torchvision==0.29.1"]
cuda = ["torch==2.14.1", "torchvision==0.29.1"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
